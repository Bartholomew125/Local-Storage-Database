<!DOCTYPE html>
<html>
<head>
    <script src="/common.js"> </script>
    <script src="/utils.js"> </script>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <div class="header">
        <h1>Daddybasen</h1>
        <div id="usericon"></div>
    </div>
    <main>
        <div id="navbar"></div>

        <!-- SORTING SELECTION -->
        <select id="sortBy">
            <option value="taken_at">Taken At</option>
        </select>

        <!-- ORDERING SELECTION -->
        <select id="ordering">
            <option value="ASC">Ascending</option>
            <option value="DESC">Descending</option>
        </select>

        <!-- LIGHTBOX -->
        <div id="lightbox" class="lightbox" style="display: none">
            <div class="lightbox-contents">
                <div id="lightbox-media-menu-wrap">
                    <!-- MENU BUTTON -->
                    <button id="lightbox-menu-button">
                        Menu
                    </button>

                    <!-- MENU POPUP -->
                    <div id="lightbox-menu-popup">
                        <button class="menu-item-button" data-action="rename">
                            <i class="fa-regular fa-pen-to-square"></i> 
                            Rename
                        </button>
                        <button class="menu-item-button" data-action="add tags">
                            <i class="fa-solid fa-tag"></i>
                            Add tags
                        </button>
                        <button class="menu-item-button" data-action="remove">
                            <i class="fa-regular fa-trash-can"></i>
                            Remove
                        </button>
                        <button id="toggle-tags-button" class="menu-item-button" data-action="toggle tags">
                            Show tags 
                        </button>
                    </div>

                    <!-- MEDIA -->
                    <div id="lightbox-media">
                        <!-- IMAGE OR VIDEO -->
                        <img id="lightbox-image" src="" alt="" style="display:none;">
                        <video id="lightbox-video" style="display:none;" autoplay loop controls>
                            <source src="" type="video/mp4">
                        </video>

                        <!-- CAPTION -->
                        <div id="lightbox-caption">
                            <p id="lightbox-caption-title"></p>
                            <p id="lightbox-caption-date"></p>
                        </div>
                    </div>

                    <div id="lightbox-addtag-popup"></div>

                </div>

                <!-- TAGS -->
                <div id="lightbox-tags"></div>
            </div>
        </div>

        <!-- GALLERY -->
        <div id="gallery"></div>

    </main>
    <script>
        initGallery();
        initLightbox();

        // Read params from URL on load
        const params = new URLSearchParams(window.location.search);
        document.getElementById("sortBy").value   = params.get("sortBy")   || "taken_at";
        document.getElementById("ordering").value = params.get("ordering") || "DESC";

        loadContent();

        // On change, push new params to URL and reload
        function updateSort() {
            const sortBy   = document.getElementById("sortBy").value;
            const ordering = document.getElementById("ordering").value;
            window.location.href = `?sortBy=${sortBy}&ordering=${ordering}`;
        }

        document.getElementById("sortBy").addEventListener("change",   updateSort);
        document.getElementById("ordering").addEventListener("change", updateSort);
    </script>
</body>
</html>
