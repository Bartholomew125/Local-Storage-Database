<!DOCTYPE html>
<html>
<head>
    <script src="/common.js"> </script>
    <script src="/utils.js"> </script>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <div class="header">
        <h1>Daddybasen</h1>
        <div id="usericon"></div>
    </div>
    <main>
        <div id="navbar"></div>
        <select id="sortBy">
            <option value="taken_at">Taken At</option>
        </select>
        <select id="ordering">
            <option value="ASC">Ascending</option>
            <option value="DESC">Descending</option>
        </select>
        <div id="gallery"></div>
        <div id="lightbox" style="display:none;">
            <div class="lightbox-frame">

                <img id="lightbox-img" alt="" style="display:none;">
                <video id="lightbox-video" style="display:none;" autoplay loop controls>
                    <source src="" type="video/mp4">
                </video>

                <div id="lightbox-caption">
                    <p id="lightbox-title"></p>
                    <div class="lightbox-menu-wrap">
                        <!-- menu popup -->
                        <div class="lightbox-menu-popup" id="lightbox-menu-popup">
                            <button class="menu-item" data-action="rename">
                                <i class="fa-regular fa-pen-to-square"></i> 
                                 Rename
                            </button>
                            <button class="menu-item" data-action="tags">
                                <i class="fa-solid fa-tag"></i>
                                 Add tags
                            </button>
                            <button class="menu-item menu-item--danger" data-action="delete">
                                <i class="fa-regular fa-trash-can"></i>
                                 Remove
                            </button>
                        </div>
                        <button class="lightbox-menu-btn" id="lightbox-menu-btn">
                            <i class="fa-solid fa-ellipsis"></i>
                        </button>
                    </div>
                    <p id="lightbox-date"></p>
                </div>
            </div>
        </div>
    </main>
    <script>
        initGallery();
        initLightbox();

        // Read params from URL on load
        const params = new URLSearchParams(window.location.search);
        document.getElementById("sortBy").value   = params.get("sortBy")   || "taken_at";
        document.getElementById("ordering").value = params.get("ordering") || "DESC";

        loadContent();

        // On change, push new params to URL and reload
        function updateSort() {
            const sortBy   = document.getElementById("sortBy").value;
            const ordering = document.getElementById("ordering").value;
            window.location.href = `?sortBy=${sortBy}&ordering=${ordering}`;
        }

        document.getElementById("sortBy").addEventListener("change",   updateSort);
        document.getElementById("ordering").addEventListener("change", updateSort);
    </script>
</body>
</html>
