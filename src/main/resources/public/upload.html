<!DOCTYPE html>
<html>
<head>
    <link rel="stylesheet" href="upload.css">

    <script src="/common.js"></script>
    <script src="/upload.js"></script>
</head>
<body>
    <header>
        <h1>Daddybasen</h1>
        <div id="usericon"></div>
    </header>
    <main>

    </main>
